[project]
name = "rugix-system-tests"
version = "0.0.0"
description = "System tests for Rugix Ctrl and Rugix Bundler."
requires-python = ">=3.11"
dependencies = [
    "rugix-testkit @ git+https://github.com/rugix/rugix-testkit.git@main",
    "pytest-xdist>=3.0",
]

[dependency-groups]
dev = ["mypy>=1.0", "ruff>=0.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
rugix_boot_system = "customized-amd64"
# Session fixtures in test modules write to fixed paths under the project, so
# each module must run on a single pytest-xdist worker.
addopts = "--dist loadfile"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.mypy]
python_version = "3.11"
strict = true
# Tests traverse JSON output from rugix-ctrl with chained subscripts. Strict
# typing of JsonValue would turn those into a wall of casts.
disable_error_code = ["call-overload", "index", "no-any-return", "union-attr"]

[tool.ruff]
target-version = "py311"
