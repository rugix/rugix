name: Build

on:
  schedule:
    # This builds the nightly version of Rugix.
    - cron: "0 0 * * *"
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build_binaries_linux:
    name: "Build Binaries (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-gnueabi
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Install Locked Tools
        run: mise install --locked github:cross-rs/cross github:CycloneDX/cyclonedx-rust-cargo
      - name: Build Binaries
        run: mise run --skip-tools build ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries/binaries-${{ matrix.target }}.tar
          if-no-files-found: error

  build_binaries_mac:
    name: "Build Binaries (${{ matrix.target }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Build Binaries
        run: mise run --skip-tools build:mac ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: binaries-${{ matrix.target }}.tar
          if-no-files-found: error

  test:
    name: Test
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
      packages: read
    needs:
      - build_binaries_linux
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: Extract Binaries
        shell: bash
        run: |
          set -euo pipefail
          cd build/binaries
          for tar_file in *.tar; do
            if [ -f "${tar_file}" ]; then
              target_name="${tar_file%.tar}"
              target_name="${target_name#binaries-}"
              mkdir -p "$target_name"
              tar -xf "$tar_file" -C "$target_name"
              rm -f "$tar_file"
            fi
          done
          find .
      - name: Run Tests
        shell: bash
        run: |
          set -euo pipefail
          export RUGIX_BAKERY_IMAGE="ghcr.io/rugix/rugix-bakery:branch-main"
          export RUGIX_BINARIES_DIR="$(pwd)/build/binaries"
          podman pull "$RUGIX_BAKERY_IMAGE"
          mise install --locked python uv
          mise run --skip-tools test:system
      - name: Upload Test Outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: tests/test-outputs/
          if-no-files-found: ignore

  build_debs:
    name: "Build Debian Packages (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs:
      - build_binaries_linux
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries
      - name: Extract Binaries
        run: |
          cd build/binaries
          mkdir -p ${{ matrix.target }}
          tar -xf binaries-${{ matrix.target }}.tar -C ${{ matrix.target }}
          rm -f binaries-${{ matrix.target }}.tar
      - name: Build Debian Packages
        run: mise run --skip-tools package:deb ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.target }}
          path: build/debs/*.deb
          if-no-files-found: error

  build_source_package:
    name: "Build Debian Source Package"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Build Source Package
        run: mise run --skip-tools package:source
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-package
          path: build/source/*
          if-no-files-found: error

  upload_release_assets:
    name: "Upload Release Assets"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build_binaries_linux
      - build_binaries_mac
      - build_debs
      - build_source_package
      - test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: build/binaries
          merge-multiple: true
      - name: Download Debian Packages
        uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          path: build/debs
          merge-multiple: true
      - name: Download Source Package
        uses: actions/download-artifact@v8
        with:
          name: source-package
          path: build/source
      - name: Remove Packages Not Intended for Release
        run: rm -f build/debs/rugix-util-*.deb
      - name: List Assets
        run: |
          find build/binaries
          find build/debs
          find build/source
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} build/binaries/* build/debs/* build/source/* --clobber
