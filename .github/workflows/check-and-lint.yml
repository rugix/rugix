name: Check and Lint

on:
  # Pull requests cover other branches, so that their pushes do not run twice.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  packaging:
    name: Test Debian Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Debian Packaging
        run: python3 scripts/tests/test_build_debs.py

  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Install Locked Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked cargo:cargo-deny github:google/osv-scanner
      - name: Check
        run: mise run --skip-tools check

  check-tests:
    name: Check System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Locked Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked python uv
      - name: Check System Tests
        run: mise run --skip-tools check:tests
