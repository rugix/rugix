name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packaging:
    name: Test Debian Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Debian Packaging
        run: python3 scripts/tests/test_build_debs.py

  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Install Locked Tools
        run: mise install --locked cargo:cargo-deny github:google/osv-scanner
      - name: Check
        run: mise run --skip-tools check
