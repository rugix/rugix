name: Check and Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Install Locked Tools
        run: mise install --locked cargo:cargo-deny github:google/osv-scanner
      - name: Check
        run: mise run --skip-tools check

  installation-grants:
    name: Installation Grants
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Build
        run: cargo build --locked -p rugix-ctrl -p rugix-bundler
      - name: Test Installation Grants
        run: python3 scripts/test-install-grants.py
