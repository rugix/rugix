name: Check and Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  script_tests:
    name: Test Release and Packaging Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Release and Packaging Scripts
        run: python3 -m unittest discover -s scripts/tests -v

  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Rust Toolchain
        run: rustup show active-toolchain
      - name: Install Locked Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked cargo:cargo-deny github:google/osv-scanner
      - name: Check
        run: mise run --skip-tools check

  check-tests:
    name: Check System Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.5
          install: false
          cache: true
      - name: Install Locked Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked python uv
      - name: Check System Tests
        run: mise run --skip-tools check:tests
