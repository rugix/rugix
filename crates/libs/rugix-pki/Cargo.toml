[package]
name = "rugix-pki"
edition = "2024"
authors.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CMS signature creation and verification for Rugix"

[dependencies]
# CMS (Cryptographic Message Syntax) parsing and creation
cms = "0.2.3"
x509-cert.workspace = true
const-oid.workspace = true
der.workspace = true
spki = "0.7"

# Cryptographic primitives
aws-lc-rs = { version = "1.15", features = ["ring-sig-verify"] }

# Secure memory handling
zeroize = { version = "1", features = ["alloc"] }

# Utilities
base64 = "0.22"
pem-rfc7468 = { version = "0.7", features = ["std", "alloc"] }

# X.509 chain validation
rustls-webpki = { version = "0.103", default-features = false, features = [
    "std",
    "aws-lc-rs",
] }
rustls-pki-types = { version = "1.12", default-features = false, features = [
    "std",
] }

# Error handling
thiserror.workspace = true
reportify.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile = "3"

[lints]
workspace = true
