[bundle]
name = "rugix_bundle"
version = "1"
description = "Sidex schema for Rugix Ctrl."
authors = ["Silitics GmbH <info@silitics.com>"]

[dependencies]
rugix_grants = { path = "../rugix-grants" }

[backend.json-schema]

[backend.rust]
derive = ["Clone", "Debug"]
plugins = ["builder", "serde"]

[backend.rust.external]
rugix_grants = "::rugix_grants"

[backend.rust.types.table]
"::core::builtins::Map" = "::std::collections::BTreeMap"

[backend.rust.plugin.serde]
sidex_serde_path = "::sidex_serde"
